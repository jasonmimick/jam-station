# jam-station as a slab system: brain (FastAPI) + icecast (streams) + jam-radio
# (liquidsoap). Deploy to the home mac-mini:
#
#   slab -N jasons-mac-mini up .
#   slab -N jasons-mac-mini secret set jam-brain ANTHROPIC_API_KEY=sk-ant-...
#   slab -N jasons-mac-mini deploy jam-brain        # redeploy to pick up the secret
#
# Startup order doesn't matter: jam-radio exits if the brain isn't up yet and
# slab restarts it until channel fetch succeeds.
#
# Not in this system (vs docker-compose): navidrome + the library/fusion
# channel — they need the owner's music files mounted, which slab named
# volumes don't cover yet. Archive + phish.in channels are unaffected.
name = "jam-station"

[apps.jam-brain]
source = "./brain"

[apps.jam-icecast]
source = "./slab/icecast"

[apps.jam-radio]
source = "./liquidsoap"

# jam-listen: the new minimal, audio-first client (docs/DESIGN-jam-listen.md over there;
# own repo, own history — NOT a jam-station page). It's a member of THIS system, not a
# standalone slab app, purely so it lands on jam-brain's docker network and can reach it
# by service name — cross-system apps can't resolve each other by name (only same-system
# members can, per slab's model). It talks to jam-brain's /api/internal/* (mint-session,
# member-by-email), which is host-gated on Host: jam-brain.localhost — see
# jam-listen/server/app/brain_client.py, which sets that header explicitly regardless of
# the address it actually connects to.
# ASSUMES jam-listen is checked out as a sibling of this repo on the deploy host (e.g.
# ~/business/jam-listen next to ~/business/jam-station) — adjust the relative path below
# if the real layout differs.
[apps.jam-listen]
source = "../jam-listen"

[wires]
"jam-radio.BRAIN_URL" = "http://jam-brain:8080"
"jam-radio.ICECAST_HOST" = "jam-icecast"
"jam-brain.LIQUIDSOAP_HOST" = "jam-radio"
"jam-listen.BRAIN_URL" = "http://jam-brain:8080"
